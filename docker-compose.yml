services:
  boipt:
    build: .
    image: boipt:latest
    container_name: boipt
    restart: unless-stopped
    # Alleen op localhost: nginx zet hem op isaac.wolfs.dev met HTTPS.
    ports:
      - "127.0.0.1:${PORT:-8090}:8080"
    volumes:
      # accounts, sessies en voortgang blijven hier staan, ook na een rebuild
      - ./data:/data
    environment:
      # Alleen nodig om de oude voortgang van vóór de accounts over te nemen.
      ACCESS_PIN: "${ACCESS_PIN:-}"
      STEAM_ID: "${STEAM_ID:-}"
      STEAM_API_KEY: "${STEAM_API_KEY:-}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
